name: Test and deploy API to cPanel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpanel-production-api
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out API
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Django checks and tests
        run: |
          python manage.py check
          python manage.py test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PORT: ${{ vars.CPANEL_SSH_PORT || '21098' }}
      APP_ROOT: ${{ vars.CPANEL_APP_ROOT }}
      VENV_ROOT: ${{ vars.CPANEL_VENV_ROOT }}
      STAGE_NAME: .deploy-api-${{ github.sha }}
    steps:
      - name: Check out API
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$APP_ROOT"
          test -n "$VENV_ROOT"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/cpanel_deploy
          chmod 600 ~/.ssh/cpanel_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Create remote staging directory
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USERNAME }}
        run: |
          ssh -i ~/.ssh/cpanel_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$APP_ROOT' '$STAGE_NAME'" < .github/scripts/prepare-stage.sh

      - name: Upload API release
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USERNAME }}
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.venv/' \
            --exclude='.env' \
            --exclude='db.sqlite3' \
            --exclude='frontend_dist/' \
            --exclude='media/' \
            --exclude='staticfiles/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            -e "ssh -i ~/.ssh/cpanel_deploy -p $SSH_PORT" \
            ./ "$SSH_USER@$SSH_HOST:$APP_ROOT/$STAGE_NAME/"

      - name: Validate and publish API release
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USERNAME }}
        run: |
          ssh -i ~/.ssh/cpanel_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$APP_ROOT' '$VENV_ROOT' '$STAGE_NAME'" < .github/scripts/deploy-cpanel.sh

      - name: Verify production health
        if: ${{ vars.PRODUCTION_URL != '' }}
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: curl --fail --show-error --silent --retry 5 --retry-delay 5 "$PRODUCTION_URL/api/health/"
