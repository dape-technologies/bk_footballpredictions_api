name: Test and deploy API to cPanel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpanel-production-api
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out API
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Django checks and tests
        run: |
          python manage.py check
          python manage.py test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PORT: ${{ vars.CPANEL_SSH_PORT || '21098' }}
      APP_ROOT: ${{ vars.CPANEL_APP_ROOT }}
      VENV_ROOT: ${{ vars.CPANEL_VENV_ROOT }}
      STAGE_NAME: .deploy-api-${{ github.sha }}
    steps:
      - name: Check out API
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$APP_ROOT"
          test -n "$VENV_ROOT"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/cpanel_deploy
          chmod 600 ~/.ssh/cpanel_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Create remote staging directory
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USERNAME }}
        run: |
          ssh -i ~/.ssh/cpanel_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$APP_ROOT' '$STAGE_NAME'" < .github/scripts/prepare-stage.sh

      - name: Upload API release
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USERNAME }}
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.venv/' \
            --exclude='.env' \
            --exclude='db.sqlite3' \
            --exclude='frontend_dist/' \
            --exclude='media/' \
            --exclude='staticfiles/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            -e "ssh -i ~/.ssh/cpanel_deploy -p $SSH_PORT" \
            ./ "$SSH_USER@$SSH_HOST:$APP_ROOT/$STAGE_NAME/"

      - name: Stage production application configuration
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USERNAME }}
          RELWORX_API_KEY: ${{ secrets.RELWORX_API_KEY }}
          RELWORX_ACCOUNT_NO: ${{ secrets.RELWORX_ACCOUNT_NO }}
          RELWORX_WEBHOOK_SIGNING_KEY: ${{ secrets.RELWORX_WEBHOOK_SIGNING_KEY }}
          RELWORX_API_BASE_URL: ${{ vars.RELWORX_API_BASE_URL || 'https://payments.relworx.com' }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          ADMIN_LOGIN_USERNAME: ${{ vars.ADMIN_LOGIN_USERNAME || 'admin' }}
          ADMIN_SEED_PHONE: ${{ vars.ADMIN_SEED_PHONE || '0700000000' }}
          ADMIN_SEED_PASSWORD: ${{ secrets.ADMIN_SEED_PASSWORD }}
        run: |
          test -n "$RELWORX_API_KEY"
          test -n "$RELWORX_ACCOUNT_NO"
          test -n "$RELWORX_WEBHOOK_SIGNING_KEY"
          test -n "$RELWORX_API_BASE_URL"
          test -n "$PRODUCTION_URL"
          test -n "$ADMIN_LOGIN_USERNAME"
          test -n "$ADMIN_SEED_PHONE"
          test -n "$ADMIN_SEED_PASSWORD"

          for value in "$RELWORX_API_KEY" "$RELWORX_ACCOUNT_NO" "$RELWORX_WEBHOOK_SIGNING_KEY" "$RELWORX_API_BASE_URL" "$PRODUCTION_URL" "$ADMIN_LOGIN_USERNAME" "$ADMIN_SEED_PHONE" "$ADMIN_SEED_PASSWORD"; do
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "Relworx configuration values must not contain newlines." >&2
              exit 1
            fi
          done

          secrets_file="$RUNNER_TEMP/relworx-production.env"
          trap 'rm -f -- "$secrets_file"' EXIT
          umask 077
          {
            printf 'RELWORX_API_KEY=%s\n' "$RELWORX_API_KEY"
            printf 'RELWORX_ACCOUNT_NO=%s\n' "$RELWORX_ACCOUNT_NO"
            printf 'RELWORX_WEBHOOK_SIGNING_KEY=%s\n' "$RELWORX_WEBHOOK_SIGNING_KEY"
            printf 'RELWORX_API_BASE_URL=%s\n' "${RELWORX_API_BASE_URL%/}"
            printf 'RELWORX_WEBHOOK_URL=%s/api/v1/payments/relworx/webhook/\n' "${PRODUCTION_URL%/}"
            printf 'ADMIN_LOGIN_USERNAME=%s\n' "$ADMIN_LOGIN_USERNAME"
            printf 'ADMIN_SEED_PHONE=%s\n' "$ADMIN_SEED_PHONE"
            printf 'ADMIN_SEED_PASSWORD=%s\n' "$ADMIN_SEED_PASSWORD"
          } > "$secrets_file"

          scp -i ~/.ssh/cpanel_deploy -P "$SSH_PORT" "$secrets_file" \
            "$SSH_USER@$SSH_HOST:$APP_ROOT/$STAGE_NAME/.production-env"
          ssh -i ~/.ssh/cpanel_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "chmod 600 '$APP_ROOT/$STAGE_NAME/.production-env'"

      - name: Validate and publish API release
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USERNAME }}
        run: |
          ssh -i ~/.ssh/cpanel_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$APP_ROOT' '$VENV_ROOT' '$STAGE_NAME'" < .github/scripts/deploy-cpanel.sh

      - name: Verify production health
        if: ${{ vars.PRODUCTION_URL != '' }}
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: curl --fail --show-error --silent --retry 5 --retry-delay 5 "$PRODUCTION_URL/api/health/"
